name: MCI Configs Pipeline

on:
  schedule:
    # اجرا هر ۶ ساعت یک‌بار به‌صورت خودکار
    - cron: '0 */6 * * *'
  workflow_dispatch: # قابلیت اجرای دستی با دکمه برای تست

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Pipeline
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Save and Commit Configs to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MCI_Configs.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update MCI configs [skip ci]" && git push)
