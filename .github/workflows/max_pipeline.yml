name: Max Pipeline (Repo Only)

on:
  schedule:
    # اجرا هر ۲ ساعت یک‌بار، دقیقاً در دقیقه ۲۰
    - cron: '20 */2 * * *'
  workflow_dispatch: # امکان اجرای دستی با دکمه برای تست

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Max Pipeline
        env:
          SOURCE_Max: ${{ secrets.SOURCE_Max }}
        run: |
          python pipeline_max.py

      - name: Commit and Push Verified Configs to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add configs_*.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update verified configs from SOURCE_Max [skip ci]" && git push)
